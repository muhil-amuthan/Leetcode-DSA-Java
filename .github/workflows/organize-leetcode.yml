name: Organize LeetCode Solutions

on:
  push:
    branches:
      - main
      - master
      - dev
  workflow_dispatch:

concurrency:
  group: organize-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  organize:
    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------
      # Download repository
      # ------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ------------------------------------------------
      # Install Python
      # ------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # ------------------------------------------------
      # Run organizer
      # ------------------------------------------------
      - name: Organize LeetCode solutions
        run: python -B .github/organize_leetcode.py
        env:
          PYTHONDONTWRITEBYTECODE: "1"

      # ------------------------------------------------
      # Push changes back to GitHub
      # ------------------------------------------------
      - name: Commit and push changes
        run: |

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [[ -n "$(git status --porcelain)" ]]; then

            git add .
            git commit -m "Organize LeetCode solutions [skip ci]"

            # Pull and rebase with retry to handle rapid successive pushes (e.g. from LeetHub)
            pushed=false
            for i in {1..5}; do
              echo "Attempt $i: pulling latest changes and pushing..."
              git pull --rebase origin "${{ github.ref_name }}" && git push origin "${{ github.ref_name }}" && pushed=true && break || sleep 3
            done

            if [ "$pushed" = false ]; then
              echo "Failed to push changes after multiple attempts."
              exit 1
            fi

          else

            echo "No changes to commit."

          fi
